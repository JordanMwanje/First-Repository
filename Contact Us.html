<!DOCTYPE html>

	<title>Contract US</title>
	<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
    min-height: 100vh;
}


.overlay {
    background-color: rgba(0, 0, 0, 0.4);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.contact-card {
    background-color: rgba(18, 18, 18, 0.85); 
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 40px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.contact-card h1 {
    font-size: 2.2rem;
    color: #e62429; 
    text-transform: uppercase;
    letter-spacing: 1px;
}

.subheading {
    color: #cccccc;
    margin-bottom: 30px;
}



.submit-btn:hover {
    background-color: #b81b20;
}

<body>

    <div class="overlay">
        <main class="contact-card">
            <h1>Contact Us</h1>

                    <p><strong>Phone:</strong> +1 (555) 019-2834</p>
