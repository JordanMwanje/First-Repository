<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-32x32.png">
    <title>Featured</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Muli&display=swap');

* {
    box-sizing: border-box;
    color: antiquewhite;
}

body {
    font-family: 'Muli', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    margin: 0;
   background-image: linear-gradient(to bottom, #000 0%, #fff 50%, #f72e2e 50%, #fff 100%);
}

.container {
    display: flex;
    width: 90vw;
}

.panel {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 80vh;
    border-radius: 50px;
    color:cadetblue;
    cursor: pointer;
    flex: 0.5;
    margin: 10px;
    position: relative;
    transition: flex 0.7s ease-in;
    justify-content: center;
}    



.panel h3 {
    font-size: 24px;
    position: absolute;
    color: #ffff;
    bottom: 20px;
    left: 20px;
    margin: 0;
    opacity: 0;
    transition: opacity 0.3s ease-in 0.4s;
}

.panel.active {
    flex: 5;
}

.panel:hover {
    flex: 5;
}

.panel:hover h3 
.panel:active h3{
    opacity: 1;
    transition: opacity 0.3 ease-in 0.4s;
}


.panel.active h3 {
    opacity: 1;
    transition: opacity 0.3s ease-in 0.4s;
}

@media(max-width: 480px) {
    .contianer {
        width: 100vw;
    }
    .panel:nth-of-type(4),
    .panel:nth-of-type(5) {
        display: none;
    }
}

.home {
    background-color: black;
    color: black;
    border-radius: 30px;
    padding: 10px;
    outline: none;
    position: absolute;
    top: 30px;
    left: 30px;
    cursor: pointer;
    width: 50px;
    border: none;
    width: 70px;
    text-decoration: none;
}

    </style>
</head>
<body>
    <header>
        <nav>
        <button class="home">
            <a href="index.html">Home</a>
        </button>  
        </nav>
    </header>
       <div class="container">
        <div class="panel active" style="background-image: url('images/2019-koenigsegg-regera.jpg');">
            <h3>koenigsegg regera</h3>
        </div>

        <div class="panel" style="background-image: url('https://www.supercars.net/blog/wp-content/uploads/2020/10/wallpaperflare.com_wallpaper-2-3.jpg');">
            <h3>Pagani Zonda</h3>
        </div>

        <div class="panel" style="background-image: url('https://wallpaperaccess.com/full/564010.jpg');">
            <h3>Bugatti Veryon</h3>
        </div>

        <div class="panel" style="background-image: url('https://wallpaperaccess.com/full/2862523.jpg');">
            <h3>Lamborghini Aventador</h3>
        </div>

        <div class="panel" style="background-image: url('https://wallpaperaccess.com/full/1855044.jpg');">
            <h3>Ferrari F40</h3>
        </div>
    </div>

    <script>
       const panels = document.querySelectorAll('.panel')
panels.forEach((panel) => {
    panel.addEventListener('click', () => {
        removeActiveClasses()
        panel.classList.add('active')
    }) 
})

function removeActiveClasses() {
    panels.forEach(panel => {
        panel.classList.remove('active')
    })
} 



panels.forEach((panel) => {
    panel.addEventListener('click', () => {
        
        if (panel.classList.contains('active')) {
            panel.classList.remove('active'); 
        } else {
            removeActiveClasses(); 
            panel.classList.add('active');
        }
    }); 
});

function removeActiveClasses() {
    panels.forEach(panel => {
        panel.classList.remove('active');
    });
}


    </script>
</body>
</html>
